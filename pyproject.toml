[project]
name = "ReWheel"
version = "1.5.0"
description = "A lightweight neural network simulator and toolkit!"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pylint",
    "build",
    "twine",
    "pip-review",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/rewheel",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rewheel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]